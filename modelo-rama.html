<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ecoandino · GLB nuevo</title><script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script><style>html,body{margin:0;width:100%;height:100%;background:#17251d;color:white;font-family:Arial}header{position:fixed;z-index:5;top:12px;left:12px;right:12px;text-align:center;background:#17251de8;padding:12px;border-radius:10px}a-scene{position:fixed;inset:0}</style></head><body><header>GLB nuevo · Ecoandino_Rama_Izquierda_WebAR.glb<br><small id="state">Cargando modelo, sin cámara ni geometría anterior…</small></header><a-scene renderer="colorManagement:true" vr-mode-ui="enabled:false" background="color:#17251d"><a-assets><a-asset-item id="asset" src="./Ecoandino_Rama_Izquierda_WebAR.glb"></a-asset-item></a-assets><a-entity position="0 0 -2.4" animation="property:rotation;to:0 360 0;dur:24000;loop:true;easing:linear"><a-gltf-model id="model" src="#asset"></a-gltf-model></a-entity><a-camera position="0 0 0" look-controls="enabled:false" wasd-controls="enabled:false"></a-camera></a-scene><script>const el=document.querySelector('#model');let ready=false;function fit(){if(ready)return;const mesh=el.getObject3D('mesh');if(!mesh)return;const measure=mesh.clone();measure.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(measure),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3()),scale=1.5/Math.max(size.x,size.y,size.z);mesh.scale.multiplyScalar(scale);mesh.position.sub(center.multiplyScalar(scale));ready=true;document.querySelector('#state').textContent='Modelo GLB cargado · gira automáticamente';}el.addEventListener('model-loaded',fit);el.addEventListener('model-error',()=>document.querySelector('#state').textContent='Error al cargar el GLB');fit();</script></body></html>
