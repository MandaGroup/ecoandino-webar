<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ecoandino · Innovemus Demo</title><style>
:root{--ink:#17372d;--green:#245844;--lime:#d7ec9b;--paper:#f5f5ee;--muted:#687b70;--line:#dce2d6}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px system-ui,-apple-system,sans-serif}button,select,input{font:inherit}button,a,select{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:11px 16px;background:white;color:var(--ink)}button:hover{border-color:var(--green)}button:disabled{opacity:.5;cursor:default}button.primary{background:var(--green);color:white;border-color:var(--green)}a{color:var(--green)}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#17372d;color:white;padding:30px 20px;display:flex;flex-direction:column;gap:30px}aside strong{font-size:24px;letter-spacing:-1px}aside small{color:#bed0c3}nav{display:grid;gap:8px}nav button{text-align:left;background:none;border:0;color:#c9d7cb}nav button.active{background:#315344;color:white}aside footer{margin-top:auto;color:#b6caba;font-size:12px;line-height:1.7}main{padding:28px 40px;max-width:1600px;width:100%}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:32px}.badge{background:#e8eccc;padding:7px 12px;border-radius:20px;font-size:12px;font-weight:700}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}h1{font-size:36px;font-weight:600;letter-spacing:-1.3px;margin:8px 0 10px}h2{font-size:22px;font-weight:600;letter-spacing:-.5px;margin:0 0 16px}p{line-height:1.6}.sub{color:var(--muted);max-width:760px}.filters{display:flex;flex-wrap:wrap;gap:12px;margin:26px 0}.filters label{font-size:12px;color:var(--muted);display:grid;gap:6px}select,input{padding:10px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:24px 0}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:24px}.kpi strong{display:block;font-size:34px;font-weight:600;letter-spacing:-1px;margin:10px 0}.kpi small{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}.full{margin-top:20px}.row{display:flex;justify-content:space-between;gap:16px;align-items:center}.bar{height:12px;border-radius:10px;background:#edf0e5;margin:8px 0 18px;overflow:hidden}.bar span{display:block;height:100%;background:#6d9b67;border-radius:10px}.caption{font-size:12px;color:var(--muted);line-height:1.6}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:14px 8px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:500}.callout{padding:18px 24px;border-radius:12px;background:#e8eddc;margin-top:20px}.callout b{display:block;margin-bottom:5px}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.steps span{padding:8px 12px;border-radius:30px;background:#e9edde;font-size:12px}.steps .done{background:var(--green);color:white}.phone{max-width:340px;margin:auto;border:9px solid #19392f;border-radius:32px;padding:24px 20px;min-height:420px;background:#eef2df;text-align:center}.pack{margin:20px auto;background:#e3cfb1;width:125px;height:150px;border-radius:12px 12px 24px 24px;box-shadow:0 12px 25px #24463122;padding-top:35px;font-size:12px;letter-spacing:2px}.pack b{display:block;margin-top:20px;color:#614531;letter-spacing:0}.phone button{width:100%;margin:5px 0}.log{list-style:none;padding:0;max-height:250px;overflow:auto}.log li{font-size:13px;padding:12px 0;border-bottom:1px solid var(--line)}.campaigns{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px}.campaigns .card{display:flex;flex-direction:column}.campaigns button{margin-top:auto}.tag{font-size:11px;color:var(--green);background:#edf2e1;padding:5px 9px;border-radius:20px;display:inline-block}.price{font-size:44px;font-weight:600;margin:10px 0}.product-list{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.product-list .card{padding:20px}.product-list h3{margin:10px 0}.deck{background:#17372d;color:#f4f5ec;padding:48px;border-radius:18px;min-height:500px;display:flex;flex-direction:column}.deck h1{font-size:44px;max-width:800px}.deck .sub{color:#cad9c7;font-size:22px;max-width:850px}.deck ul{font-size:22px;line-height:1.8;padding-left:24px}.deck footer{margin-top:auto;color:#b7cfae}.deck-controls{margin-top:16px;display:flex;justify-content:space-between;align-items:center}.toast{position:fixed;bottom:20px;right:20px;background:#17372d;color:white;padding:16px 22px;border-radius:12px;z-index:20;max-width:420px}.hidden{display:none!important}.scroll{overflow:auto}.mini{font-size:12px}.metric-note{font-size:13px;color:var(--muted);margin-top:18px}.hero-stat{font-size:58px;font-weight:600;color:#d7ec9b}.hero{background:#17372d;color:white;padding:28px;border-radius:14px}.hero p{color:#cfddca}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #90b64d;outline-offset:3px}@media(max-width:1050px){main{padding:24px}.kpis{grid-template-columns:repeat(2,1fr)}.campaigns{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}@media(max-width:700px){.shell{display:block}aside{padding:18px;gap:15px}nav{display:flex;overflow:auto}nav button{white-space:nowrap}aside footer{display:none}main{padding:20px 16px}.top{margin-bottom:20px}h1{font-size:29px}.card{padding:18px}.kpi strong{font-size:28px}.product-list{grid-template-columns:1fr}.deck{padding:26px;min-height:530px}.deck h1{font-size:34px}.deck .sub,.deck ul{font-size:18px}}@media print{aside,.top,.filters,button,.deck-controls{display:none!important}.shell{display:block}main{padding:0}.deck{background:white;color:#17372d;min-height:auto}.deck .sub{color:#17372d}}
</style></head><body><div class="shell"><aside><div><strong>innovemus<span style="color:#d7ec9b">.</span></strong><br><small>Empaques que conectan</small></div><nav aria-label="Secciones"><button data-view="overview" class="active">◉ Resumen comercial</button><button data-view="journey">↗ Vivir la interacción</button><button data-view="campaigns">◇ Campañas</button><button data-view="products">▦ Productos y planes</button><button data-view="pitch">▷ Presentación comercial</button></nav><footer>Propuesta para Ecoandino<br>Manda Creative + Innovemus<br><br>Demo conceptual. Sin conexión a consumidores, ventas ni WhatsApp.</footer></aside><main><div class="top"><div><b>Ecoandino</b><br><small class="sub">Espacio de marca</small></div><span class="badge">DEMO · DATOS SIMULADOS</span></div><div id="content"></div></main></div><div id="toast" class="toast hidden" role="status"></div><script>
const AR='https://raw.githack.com/MandaGroup/ecoandino-webar/439c76251117d7107a8d5b76d45d6425aca81b5e/index.html';
const products=[{id:'nibs',name:'Nibs de cacao con yacón',pack:'Empaque blanco',access:1200,start:900,detect:810,complete:675,intent:150,recipes:240,seller:118,distributor:44,web:96},{id:'powder',name:'Cacao criollo en polvo',pack:'Empaque marrón',access:1800,start:1440,detect:1296,complete:1080,intent:252,recipes:410,seller:210,distributor:62,web:155}];
const campaigns=[{id:'always',name:'Origen del cacao',desc:'Experiencia permanente que presenta el producto y ofrece recetas.',factor:1,state:'Activa en demo',experience:'Ramas 3D y cacao'},{id:'christmas',name:'Navidad con Ecoandino',desc:'Recetas de temporada y un cupón individual como propuesta de campaña.',factor:.4,state:'Borrador',experience:'Receta navideña'},{id:'loyalty',name:'Beneficio por compra',desc:'Acceso propuesto con código único y validación de compra.',factor:.2,state:'Borrador',experience:'Beneficio exclusivo'}];
let view='overview',filter={product:'all',campaign:'all',period:'30'},plan=5,stage=0,session=null,selectedProduct='nibs',selectedCampaign='always',events=[],extra=[],slide=0;
const fmt=n=>new Intl.NumberFormat('es-PE').format(n),pct=(a,b)=>b?(100*a/b).toFixed(1)+'%':'0,0%';
function totals(product=filter.product){let out={access:0,start:0,detect:0,complete:0,intent:0,recipes:0,seller:0,distributor:0,web:0};for(const p of products.filter(p=>product==='all'||p.id===product))for(const c of campaigns.filter(c=>filter.campaign==='all'||c.id===filter.campaign)){for(const k in out)out[k]+=Math.round(p[k]*c.factor*Number(filter.period)/30);}for(const e of extra.filter(e=>(product==='all'||e.product===product)&&(filter.campaign==='all'||e.campaign===filter.campaign)))out[e.key]++;return out;}
function toast(msg){const t=document.querySelector('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.add('hidden'),4500);}
function opts(arr,value){return arr.map(o=>`<option value="${o.id}" ${o.id===value?'selected':''}>${o.name}</option>`).join('');}
function filters(){return `<div class="filters"><label>Producto<select id="filter-product">${opts([{id:'all',name:'Todos los productos'},...products],filter.product)}</select></label><label>Campaña<select id="filter-campaign">${opts([{id:'all',name:'Todas las campañas'},...campaigns],filter.campaign)}</select></label><label>Periodo ilustrativo<select id="filter-period"><option value="7" ${filter.period==='7'?'selected':''}>7 días simulados</option><option value="30" ${filter.period==='30'?'selected':''}>30 días simulados</option></select></label><button id="export">Descargar CSV</button></div>`;}
function overview(){const t=totals();return `<span class="eyebrow">Atención que se puede medir</span><h1>El empaque abre una oportunidad comercial</h1><p class="sub">Compara productos, identifica intereses y evalúa campañas. Estas cifras ilustran el tablero propuesto. No son resultados de Ecoandino.</p>${filters()}<div class="kpis">${[['Accesos a la experiencia',fmt(t.access),'Aperturas de sesión, no personas únicas'],['Experiencias completadas',fmt(t.complete),pct(t.complete,t.start)+' de las iniciadas'],['Sesiones con intención comercial',fmt(t.intent),pct(t.intent,t.start)+' de las iniciadas'],['Ventas verificadas','Sin conexión','Requiere compra o canje validado']].map(x=>`<div class="card kpi"><span>${x[0]}</span><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('')}</div><div class="grid"><div class="card"><h2>Recorrido del consumidor</h2>${[['Accede',t.access],['Inicia',t.start],['Reconoce el empaque',t.detect],['Completa',t.complete],['Muestra intención comercial',t.intent]].map(([n,v])=>`<div class="row"><span>${n}</span><b>${fmt(v)}</b></div><div class="bar"><span style="width:${100*v/Math.max(t.access,1)}%"></span></div>`).join('')}<p class="caption">Intención comercial: una sesión con al menos un clic en vendedor o distribuidor. Una sesión se cuenta una sola vez.</p></div><div class="card"><h2>¿Qué busca el consumidor?</h2>${[['Recetas',t.recipes],['Contactar vendedor',t.seller],['Ser distribuidor',t.distributor],['Conocer la marca',t.web]].map(([n,v])=>`<div class="row"><span>${n}</span><b>${fmt(v)} clics</b></div><div class="bar"><span style="width:${100*v/Math.max(t.recipes,t.seller,t.distributor,t.web,1)}%"></span></div>`).join('')}<p class="caption">Los clics pueden repetirse. Abrir WhatsApp indica interés, pero no confirma una conversación o una venta.</p></div></div><div class="card full"><h2>Comparación por producto</h2><div class="scroll"><table><thead><tr><th>Producto</th><th>Accesos</th><th>Completadas</th><th>Intención comercial</th><th>Tasa de intención</th></tr></thead><tbody>${products.filter(p=>filter.product==='all'||p.id===filter.product).map(p=>{let t=totals(p.id);return `<tr><td><b>${p.name}</b></td><td>${fmt(t.access)}</td><td>${fmt(t.complete)}</td><td>${fmt(t.intent)}</td><td>${pct(t.intent,t.start)}</td></tr>`}).join('')}</tbody></table></div></div><div class="callout"><b>Una decisión que el tablero permitiría tomar</b>Si un producto genera interés en recetas, se puede probar contenido de uso. Si genera consultas de distribución, se puede reforzar el contacto comercial. La demo ilustra esta lectura, no demuestra causalidad.</div>`;}
function journey(){return `<span class="eyebrow">Demostración guiada</span><h1>Del empaque al indicador</h1><p class="sub">Simula una sesión. Cada paso actualiza el resumen comercial dentro de esta demo, sin enviar información ni abrir WhatsApp.</p><div class="filters"><label>Producto<select id="journey-product">${opts(products,selectedProduct)}</select></label><label>Campaña<select id="journey-campaign">${opts(campaigns,selectedCampaign)}</select></label><button id="new-session">Nueva sesión simulada</button></div><div class="grid"><div class="phone"><span class="tag">VISTA CONSUMIDOR SIMULADA</span><div class="pack">ECOANDINO<b>${selectedProduct==='nibs'?'Nibs con yacón':'Cacao en polvo'}</b></div><h2>${campaigns.find(c=>c.id===selectedCampaign).name}</h2><p class="mini">${stage===0?'El consumidor acerca su teléfono al adhesivo NFC.':stage<4?'Avanza para simular la experiencia.':'El consumidor elige qué hacer después.'}</p>${stage<4?`<button class="primary" id="next-step">${['1. Simular acceso NFC','2. Iniciar experiencia','3. Reconocer empaque','4. Completar animación'][stage]}</button>`:`<button data-sim="recipes">Ver recetas</button><button data-sim="seller">Contactar vendedor</button><button data-sim="distributor">Quiero distribuir</button><button data-sim="web">Conocer Ecoandino</button>`}</div><div><div class="card"><h2>Así se registra el recorrido</h2><div class="steps">${['Acceso','Inicio','Detección','Finalización'].map((n,i)=>`<span class="${stage>i?'done':''}">${n}</span>`).join('')}</div><p>Sesiones simuladas añadidas: <b>${extra.filter(e=>e.key==='access').length}</b></p><ul class="log" aria-live="polite">${events.length?events.slice().reverse().map(e=>`<li>${e}</li>`).join(''):'<li>Todavía no has simulado acciones.</li>'}</ul><button data-view="overview">Ver impacto en el tablero</button></div><div class="callout"><b>La WebAR del MVP es una experiencia separada</b><p class="mini">Puedes abrir la animación real. Sus acciones aún no alimentan este tablero simulado.</p><a href="${AR}" target="_blank" rel="noopener">Abrir MVP WebAR ↗</a></div></div></div>`;}
function campaignView(){return `<span class="eyebrow">Un adhesivo, distintas temporadas</span><h1>Las campañas cambian. El empaque permanece.</h1><p class="sub">Prueba un cambio de contenido y activa una campaña de demostración. Los cambios viven solo en esta sesión del navegador y no modifican el MVP.</p><div class="campaigns">${campaigns.map(c=>`<div class="card"><span class="tag">${c.state}</span><h2 style="margin-top:20px">${c.name}</h2><p class="sub">${c.desc}</p><label class="mini">Experiencia propuesta<select data-experience="${c.id}" style="width:100%;margin:8px 0 20px">${[...new Set([c.experience,'Ramas 3D y cacao','Receta navideña','Beneficio exclusivo'])].map(n=>`<option ${n===c.experience?'selected':''}>${n}</option>`).join('')}</select></label><button class="primary" data-launch="${c.id}">Activar en demo</button></div>`).join('')}</div><div class="grid full"><div class="card"><h2>Campaña exclusiva por compra</h2><p>Un código individual o una validación de compra permitiría habilitar un beneficio y registrar su canje.</p><label>Código ficticio para probar <input id="coupon" placeholder="ECO-DEMO-001" style="width:100%;margin:12px 0"></label><button id="redeem">Simular canje</button><p id="coupon-result" class="caption" role="status">Usa ECO-DEMO-001. Se acepta una vez durante esta sesión.</p></div><div class="card"><h2>Qué cambia y qué se mide</h2><p><b>Por producto:</b> qué empaque recibe interacción.</p><p><b>Por campaña o lote:</b> qué promoción genera interés.</p><p><b>Por unidad:</b> qué código accede o canjea un beneficio.</p><p class="caption">El NFC y el reconocimiento visual, por sí solos, no prueban una compra. El canje de esta demo no valida compras reales ni se suma al embudo de acceso.</p></div></div>`;}
function productView(){return `<span class="eyebrow">Crecimiento por catálogo</span><h1>Un espacio para cada producto</h1><p class="sub">Gestiona experiencias y campañas desde un mismo servicio. Los dos productos de cacao corresponden al MVP. Los espacios adicionales muestran capacidad propuesta.</p><div class="filters"><button class="${plan===5?'primary':''}" data-plan="5">Paquete de 5 productos</button><button class="${plan===10?'primary':''}" data-plan="10">Paquete de 10 productos</button></div><div class="hero"><div class="row"><div><span class="eyebrow" style="color:#bdd0b6">CAPACIDAD PROPUESTA</span><h2>2 productos configurados de ${plan}</h2><p>${plan-2} espacios disponibles para ampliar el catálogo</p></div><div class="hero-stat">${plan}</div></div></div><div class="product-list full">${Array.from({length:plan},(_,i)=>`<div class="card"><span class="tag">${i<2?'MVP existente':'Espacio disponible'}</span><h3>${products[i]?.name||'Producto '+(i+1)}</h3><p class="caption">${i<2?'Dos ramas realistas, cacao central y narración. Indicadores mostrados aquí: simulados.':'Incorporación propuesta de una experiencia y sus campañas. Sin producto ni animación cargados.'}</p>${i<2?`<button data-product="${products[i].id}">Ver indicadores</button>`:''}</div>`).join('')}</div><div class="callout"><b>Contenido actualizable sin reemplazar el adhesivo</b>Propuesta de enlace permanente por producto con selección de campaña desde la plataforma. Reutilizar un contenido disponible y producir una animación nueva son servicios diferentes.</div>`;}
const slides=[['El empaque como canal comercial','Ecoandino puede conectar la experiencia del consumidor con decisiones de marketing.','Manda Creative crea la experiencia y facilita los adhesivos NFC.','Innovemus propone alojarla, administrarla y medir las interacciones.'],['Primero, vivir la experiencia','El MVP ya permite enfocar ambos empaques y descubrir el cacao en WebAR.','Durante la reunión: abrir el MVP en el teléfono y enfocar un empaque.','Después: volver a esta demo para simular cómo se mediría el recorrido.'],['Después, entender qué se mide','Acceso, inicio, reconocimiento, finalización e intención comercial.','La demo permite filtrar por producto, campaña y periodo.','Clic en WhatsApp = intención de contacto. Venta = validación adicional.'],['Una acción aparece en el tablero','La sesión simulada conecta la experiencia con el indicador.','Abrir «Vivir la interacción» y completar los cuatro pasos.','Pulsar «Contactar vendedor» y volver al resumen para ver el cambio.'],['Campañas durante todo el año','Un mismo enlace puede servir contenido distinto según la campaña vigente.','Navidad: receta y beneficio de temporada.','Fidelización: código individual y canje validado como siguiente etapa.'],['Dos servicios complementarios','La creación inicial y la operación mensual tienen alcances distintos.','Manda Creative: experiencia inicial, integración y adhesivos NFC.','Innovemus: alojamiento, gestión de productos, indicadores y campañas. Nuevas producciones y adhesivos se cotizan aparte.'],['Escala de 5 a 10 productos','La marca amplía el catálogo dentro del mismo espacio.','Paquetes propuestos: 5 o 10 experiencias activas.','Precios, tráfico, almacenamiento, soporte y producción adicional quedan por definir.'],['Un piloto medible para Ecoandino','La propuesta es pasar del MVP visual a un piloto con eventos reales.','Primera etapa: dos productos, una campaña y medición del recorrido.','Acordar duración, presupuesto y criterios de éxito. Esta demo no acredita resultados ni integra ventas reales.']];
function pitch(){const d=slides[slide];return `<div class="deck"><span class="eyebrow" style="color:#d7ec9b">Manda Creative + Innovemus · Propuesta para Ecoandino</span><h1>${d[0]}</h1><p class="sub">${d[1]}</p><ul><li>${d[2]}</li><li>${d[3]}</li></ul><footer>${slide+1} / ${slides.length} · Capacidades propuestas y datos simulados</footer></div><div class="deck-controls"><button id="prev" ${slide===0?'disabled':''}>Anterior</button><button data-view="journey">Abrir demo interactiva</button><button id="next" ${slide===slides.length-1?'disabled':''}>Siguiente</button></div><p class="caption">Guion sugerido: experiencia en teléfono, recorrido simulado, tablero, campaña y propuesta de piloto. Las flechas del teclado cambian de diapositiva.</p>`;}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.querySelector('#content').innerHTML=({overview,journey,campaigns:campaignView,products:productView,pitch}[view])();}
function add(key){extra.push({key,product:selectedProduct,campaign:selectedCampaign});}
let redeemed=false;
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;render();return;}if(b.dataset.plan){plan=Number(b.dataset.plan);render();return;}if(b.dataset.product){filter.product=b.dataset.product;view='overview';render();return;}if(b.dataset.launch){const c=campaigns.find(c=>c.id===b.dataset.launch);campaigns.forEach(c=>c.state='Borrador');c.state='Activa en demo';selectedCampaign=c.id;toast('Campaña activada solo en esta demo: '+c.name);render();return;}if(b.id==='new-session'){stage=0;session=null;render();return;}if(b.id==='next-step'){if(stage===0)session={intent:false};const key=['access','start','detect','complete'][stage];add(key);events.push(products.find(p=>p.id===selectedProduct).name+' · '+['Acceso NFC simulado','Experiencia iniciada','Empaque reconocido','Animación completada'][stage]);stage++;render();return;}if(b.dataset.sim){add(b.dataset.sim);if(['seller','distributor'].includes(b.dataset.sim)&&!session.intent){add('intent');session.intent=true;}events.push('Clic simulado: '+b.textContent);toast('Acción simulada registrada. No se abre ningún servicio externo.');render();return;}if(b.id==='redeem'){const value=document.querySelector('#coupon').value.trim();const ok=value==='ECO-DEMO-001'&&!redeemed;if(ok)redeemed=true;document.querySelector('#coupon-result').textContent=ok?'Canje simulado aceptado. 1 beneficio ficticio utilizado.':redeemed&&value==='ECO-DEMO-001'?'Este código ya se utilizó en esta sesión.':'Código de demostración no válido.';return;}if(b.id==='next'){slide++;render();}if(b.id==='prev'){slide--;render();}if(b.id==='export'){const t=totals();const rows=[['DEMO DATOS SIMULADOS - NO RESULTADOS REALES'],['Producto',filter.product,'Campaña',filter.campaign,'Días simulados',filter.period],['Indicador','Valor'],...Object.entries(t),['Ventas verificadas','Sin conexión']];const blob=new Blob(['\ufeff'+rows.map(r=>r.join(';')).join('\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ecoandino-demo-indicadores.csv';a.click();URL.revokeObjectURL(a.href);}});
document.addEventListener('change',e=>{const t=e.target;if(t.id.startsWith('filter-')){filter[t.id.replace('filter-','')]=t.value;render();}if(t.id==='journey-product'||t.id==='journey-campaign'){if(t.id==='journey-product')selectedProduct=t.value;else selectedCampaign=t.value;stage=0;session=null;render();}if(t.dataset.experience){campaigns.find(c=>c.id===t.dataset.experience).experience=t.value;toast('Contenido seleccionado en demo. No se generó ni publicó una animación.');}});
document.addEventListener('keydown',e=>{if(view!=='pitch'||['INPUT','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowRight'&&slide<slides.length-1){slide++;render();}if(e.key==='ArrowLeft'&&slide>0){slide--;render();}});render();
</script></body></html>
