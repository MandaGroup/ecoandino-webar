<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

  <a-scene
    mindar-image="imageTargetSrc: ./ecoandino.mind;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="colorManagement: true;">

    <!-- Modelo 3D -->
    <a-assets>
      <a-asset-item
        id="cacao"
        src="./cacao.glb">
      </a-asset-item>
    </a-assets>

    <!-- Cámara -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- Reconocimiento del empaque -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- Mazorca de cacao 3D -->
    
<a-gltf-model
  src="#cacao"
  position="0 0 0.15"
  rotation="0 0 0"
  scale="0.01 0.01 0.01"
  animation__entrada="
    property: scale;
    from: 0.001 0.001 0.001;
    to: 0.01 0.01 0.01;
    dur: 1800;
    easing: easeOutElastic;
    startEvents: iniciarEntrada;
    autoplay: false">
</a-gltf-model>


    
<a-entity
  mindar-image-target="targetIndex: 0"
  id="targetEcoandino">


  </a-scene>


<script>
  document.addEventListener("DOMContentLoaded", () => {
    const target = document.querySelector("#targetEcoandino");
    const cacao = target.querySelector("a-gltf-model");

    target.addEventListener("targetFound", () => {
      cacao.emit("iniciarEntrada");
    });
  });
</script>
</body>
</html>
