<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

  <a-scene
    mindar-image="imageTargetSrc: ./ecoandino.mind;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="colorManagement: true;">

    <!-- Modelo 3D -->
    <a-assets>
      <a-asset-item
        id="cacao"
        src="./cacao.glb">
      </a-asset-item>
    </a-assets>

    <!-- Camara -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- Reconocimiento del empaque -->
    <a-entity
      id="targetEcoandino"
      mindar-image-target="targetIndex: 0">

      <!-- Mazorca 3D -->
      <a-gltf-model
        id="modeloCacao"
        src="#cacao"

        position="0 0 0.02"
        rotation="0 0 0"
        scale="0.001 0.001 0.001"

        animation__entrada="
          property: scale;
          from: 0.001 0.001 0.001;
          to: 0.01 0.01 0.01;
          dur: 1800;
          easing: easeOutElastic;
          startEvents: iniciarEntrada;
          autoplay: false"

        animation__elevacion="
          property: position;
          from: 0 0 0.02;
          to: 0 0 0.15;
          dur: 1800;
          easing: easeOutCubic;
          startEvents: iniciarEntrada;
          autoplay: false"

        animation__rotacion="
          property: rotation;
          from: 0 0 0;
          to: 0 360 0;
          dur: 2200;
          easing: easeInOutCubic;
          startEvents: girarCacao;
          autoplay: false">
      </a-gltf-model>

    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const scene = document.querySelector("a-scene");
      const target = document.querySelector("#targetEcoandino");
      const cacao = document.querySelector("#modeloCacao");

      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();

      let animacionTerminada = false;
      let girando = false;
      let targetVisible = false;
      let modeloCargado = false;

      cacao.addEventListener("model-loaded", () => {
        modeloCargado = true;
      });

      target.addEventListener("targetFound", () => {
        targetVisible = true;
        animacionTerminada = false;
        girando = false;

        cacao.setAttribute("scale", "0.001 0.001 0.001");
        cacao.setAttribute("position", "0 0 0.02");
        cacao.setAttribute("rotation", "0 0 0");

        cacao.emit("iniciarEntrada");
      });

      target.addEventListener("targetLost", () => {
        targetVisible = false;
        animacionTerminada = false;
      });

      cacao.addEventListener("animationcomplete__entrada", () => {
        animacionTerminada = true;
      });

      cacao.addEventListener("animationcomplete__rotacion", () => {
        girando = false;
        cacao.setAttribute("rotation", "0 0 0");
      });

      function detectarToque(event) {

        if (
          !targetVisible ||
          !modeloCargado ||
          !animacionTerminada ||
          girando
        ) {
          return;
        }

        const canvas = scene.canvas;
        if (!canvas) return;

        const rect = canvas.getBoundingClientRect();

        pointer.x =
          ((event.clientX - rect.left) / rect.width) * 2 - 1;

        pointer.y =
          -((event.clientY - rect.top) / rect.height) * 2 + 1;

        const camera = scene.camera;
        if (!camera) return;

        camera.updateMatrixWorld(true);
        cacao.object3D.updateWorldMatrix(true, true);

        raycaster.setFromCamera(pointer, camera);

        const modelo = cacao.getObject3D("mesh");
        if (!modelo) return;

        const intersecciones = raycaster.intersectObject(
          modelo,
          true
        );

        if (intersecciones.length > 0) {
          girando = true;
          cacao.emit("girarCacao");
        }
      }

      scene.addEventListener("loaded", () => {

        scene.canvas.addEventListener(
          "pointerdown",
          detectarToque
        );

      });

    });
  </script>

</body>
</html>
