<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

  <a-scene
    mindar-image="imageTargetSrc: ./ecoandino.mind;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="colorManagement: true;">

    <!-- Modelo 3D -->
    <a-assets>
      <a-asset-item
        id="cacao"
        src="./cacao.glb">
      </a-asset-item>
    </a-assets>

    <!-- Camara interactiva -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      cursor="fuse: false; rayOrigin: mouse"
      raycaster="objects: .interactivo">
    </a-camera>

    <!-- Reconocimiento del empaque -->
    <a-entity
      id="targetEcoandino"
      mindar-image-target="targetIndex: 0">

      <!-- Mazorca 3D -->
      <a-gltf-model
        id="modeloCacao"
        class="interactivo"
        src="#cacao"

        position="0 0 0.02"
        rotation="0 0 0"
        scale="0.001 0.001 0.001"

        animation__entrada="
          property: scale;
          from: 0.001 0.001 0.001;
          to: 0.01 0.01 0.01;
          dur: 1800;
          easing: easeOutElastic;
          startEvents: iniciarEntrada;
          autoplay: false"

        animation__elevacion="
          property: position;
          from: 0 0 0.02;
          to: 0 0 0.15;
          dur: 1800;
          easing: easeOutCubic;
          startEvents: iniciarEntrada;
          autoplay: false"

        animation__rotacion="
          property: rotation;
          from: 0 0 0;
          to: 0 360 0;
          dur: 2200;
          easing: easeInOutCubic;
          startEvents: girarCacao;
          autoplay: false">
      </a-gltf-model>

    </a-entity>

  </a-scene>

  <!-- Control de interacciones -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const target = document.querySelector("#targetEcoandino");
      const cacao = document.querySelector("#modeloCacao");

      let animacionTerminada = false;
      let girando = false;

      // Cuando aparece el empaque
      target.addEventListener("targetFound", () => {

        animacionTerminada = false;
        girando = false;

        cacao.setAttribute("scale", "0.001 0.001 0.001");
        cacao.setAttribute("position", "0 0 0.02");
        cacao.setAttribute("rotation", "0 0 0");

        cacao.emit("iniciarEntrada");
      });

      // Cuando termina la entrada
      cacao.addEventListener("animationcomplete__entrada", () => {
        animacionTerminada = true;
      });

      // Al tocar la mazorca
      cacao.addEventListener("click", () => {

        if (!animacionTerminada || girando) return;

        girando = true;
        cacao.emit("girarCacao");
      });

      // Al terminar la rotacion
      cacao.addEventListener("animationcomplete__rotacion", () => {
        girando = false;
        cacao.setAttribute("rotation", "0 0 0");
      });

    });
  </script>

</body>
</html>
