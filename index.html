<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ecoandino | Experiencia WebAR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:transparent;color:white}#ar-stage{position:fixed;inset:0;width:100%;height:100%;height:100dvh;overflow:hidden}#ar-stage>video{max-width:none!important;max-height:none!important;z-index:0!important}a-scene{position:absolute;inset:0;z-index:1;width:100%!important;height:100%!important;background:transparent!important}.a-canvas{width:100%!important;height:100%!important;background:transparent!important}video[src]{max-width:none}body>video,body>.mindar-ui-overlay~video{z-index:0!important}#ui{position:fixed;z-index:10;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:space-between;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom))}#status{background:#102819dc;padding:10px 16px;border:1px solid #ffffff44;border-radius:30px;font-size:13px;text-align:center}#lower{width:min(440px,100%)}#line{text-align:center;font-weight:bold;text-shadow:0 2px 8px #000;margin-bottom:16px;opacity:0;transition:opacity .5s}#actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;opacity:0;transform:translateY(22px);transition:opacity .4s,transform .4s;pointer-events:none}#actions.show{opacity:1;transform:none;pointer-events:auto}#actions button{color:white;background:#123b25e8;border:1px solid #ffffff66;border-radius:12px;padding:13px 7px;font-size:13px;font-weight:bold}#start{position:fixed;inset:0;z-index:20;background:#102819ee;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px}#start>div{max-width:340px}#start h1{font-size:25px}#start p{line-height:1.45;color:#dce8df}#begin{border:0;background:#91c53f;border-radius:12px;padding:15px 24px;font-size:16px;font-weight:bold;color:#18301b}#mute{display:none;position:fixed;z-index:11;right:15px;top:calc(env(safe-area-inset-top) + 72px);pointer-events:auto;border-radius:50%;padding:11px;background:#183a26;color:white;border:1px solid #ffffff55}#note{position:fixed;z-index:12;left:25px;right:25px;bottom:35%;text-align:center;background:#102819ed;border-radius:12px;padding:14px;display:none;font-size:13px}
</style>
<script>
AFRAME.registerComponent('branch-reveal',{
 init:function(){
  this.elapsed=0;this.tracking=false;this.ready=false;this.lastLost=0;
  this.level={value:-.98};
  this.el.object3D.visible=false;
  this.found=()=>{if(!this.lastLost||performance.now()-this.lastLost>2000)this.elapsed=0;this.tracking=true;};
  this.lost=()=>{this.tracking=false;this.lastLost=performance.now();};
  this.loaded=()=>{
   const mesh=this.el.getObject3D('mesh');if(!mesh)return;
   mesh.traverse(node=>{
    if(!node.isMesh)return;
    const patch=source=>{
     const mat=source.clone();mat.side=THREE.DoubleSide;
     mat.onBeforeCompile=shader=>{
      shader.uniforms.branchLevel=this.level;
      shader.vertexShader='varying float branchY;\n'+shader.vertexShader;
      shader.vertexShader=shader.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\nbranchY = position.y;');
      shader.fragmentShader='uniform float branchLevel;\nvarying float branchY;\n'+shader.fragmentShader;
      shader.fragmentShader=shader.fragmentShader.replace('#include <clipping_planes_fragment>','#include <clipping_planes_fragment>\nif (branchY > branchLevel) discard;');
     };
     mat.customProgramCacheKey=()=> 'ecoandino-branch-reveal-v1';
     mat.needsUpdate=true;return mat;
    };
    node.material=Array.isArray(node.material)?node.material.map(patch):patch(node.material);
   });
   this.ready=true;this.el.object3D.visible=false;
  };
  this.el.addEventListener('model-loaded',this.loaded);
  this.el.parentEl.addEventListener('targetFound',this.found);
  this.el.parentEl.addEventListener('targetLost',this.lost);
  if(this.el.getObject3D('mesh'))this.loaded();
 },
 tick:function(time,delta){
  if(!this.ready)return;
  if(this.tracking)this.elapsed+=Math.min(delta,100);
  const delay=this.el.id.includes('right')?280:0;
  const progress=Math.min(1,Math.max(0,(this.elapsed-delay)/2200));
  this.level.value=-.98+1.96*(progress*progress*(3-2*progress));
  this.el.object3D.visible=progress>0;
 },
 remove:function(){
  this.el.removeEventListener('model-loaded',this.loaded);
  this.el.parentEl.removeEventListener('targetFound',this.found);
  this.el.parentEl.removeEventListener('targetLost',this.lost);
 }
});
</script>
</head>
<body>
<div id="ar-stage">
<a-scene id="scene" mindar-image="imageTargetSrc: ./ecoandino-dual.mind; autoStart: false; filterMinCF: 0.001; filterBeta: 0.005; warmupTolerance: 5; missTolerance: 15; maxTrack: 2;" renderer="colorManagement: true; antialias: true; alpha: true" background="color: #000000; transparent: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
<a-assets timeout="30000"><a-asset-item id="cacao" src="./cacao.glb"></a-asset-item></a-assets>
<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
<a-entity id="marker" mindar-image-target="targetIndex:0">
<a-gltf-model id="left-model" branch-reveal src="./Ecoandino_Rama_Izquierda_WebAR.glb" position="-.96 .03 .04" rotation="0 0 3" scale=".473 .473 .473"></a-gltf-model>
<a-gltf-model id="right-model" branch-reveal src="./Ecoandino_Rama_Izquierda_WebAR.glb" position=".99 .06 .025" rotation="0 0 -4" scale="-.455 .455 .455"></a-gltf-model>
<a-entity id="vegetation" visible="false">

</a-entity>
<a-gltf-model id="pod" src="#cacao" visible="false" position="0 0 .03" rotation="0 0 0" scale=".001 .001 .001"
animation__grow="property:scale;from:.001 .001 .001;to:.01 .01 .01;dur:1300;easing:easeOutCubic;startEvents:grow;autoplay:false"
animation__rise="property:position;from:0 0 .03;to:0 0 .16;dur:1300;easing:easeOutCubic;startEvents:grow;autoplay:false"
animation__spin="property:rotation;from:0 0 0;to:0 360 0;dur:3500;easing:easeInOutSine;startEvents:spin;autoplay:false"></a-gltf-model>
</a-entity>
<a-entity id="marker2" mindar-image-target="targetIndex:1"><a-gltf-model id="left-model-brown" branch-reveal src="./Ecoandino_Rama_Izquierda_WebAR.glb" position="-.96 .03 .04" rotation="0 0 3" scale=".473 .473 .473"></a-gltf-model>
<a-gltf-model id="right-model-brown" branch-reveal src="./Ecoandino_Rama_Izquierda_WebAR.glb" position=".99 .06 .025" rotation="0 0 -4" scale="-.455 .455 .455"></a-gltf-model><a-gltf-model id="pod-brown" src="#cacao" visible="false" position="0 0 .03" rotation="0 0 0" scale=".001 .001 .001"
animation__grow="property:scale;from:.001 .001 .001;to:.01 .01 .01;dur:1300;easing:easeOutCubic;startEvents:grow;autoplay:false"
animation__rise="property:position;from:0 0 .03;to:0 0 .16;dur:1300;easing:easeOutCubic;startEvents:grow;autoplay:false"
animation__spin="property:rotation;from:0 0 0;to:0 360 0;dur:3500;easing:easeInOutSine;startEvents:spin;autoplay:false"></a-gltf-model></a-entity>
</a-scene>
</div>
<div id="ui"><div id="status" role="status">Activa la experiencia</div><div id="lower"><div id="line">Desde la selva peruana, a tus manos.</div><div id="actions"><button data-action="replay">↻ Repetir experiencia</button><button data-action="website">🌿 Conoce Ecoandino</button></div></div></div>
<button id="mute" aria-label="Activar o silenciar narración">🔊</button><div id="note" role="status"></div>
<div id="start"><div><h1>Ecoandino cobra vida</h1><p>Apunta la cámara al empaque para descubrir nuestro cacao en realidad aumentada.</p><button id="begin">Comenzar experiencia</button><p style="font-size:12px">Con sonido · permite la cámara y enfoca un empaque Ecoandino.</p></div></div>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s),scene=$('#scene'),marker=$('#marker'),marker2=$('#marker2'),vegetation=$('#vegetation'),status=$('#status'),actions=$('#actions');
let pod=$('#pod');
// Two image targets: 0 = white nibs with yacón, 1 = brown cacao powder.
const dualTargetsReady = true;
const soloRama=false;
let visible=false,started=false,sound=true,played=false,lostAt=0,run=0;
const timers=[];
function repairCameraLayer(){
  // MindAR creates its own camera video; place it ABOVE the page background and BELOW WebGL.
  const videos=Array.from(document.querySelectorAll('video'));
  const video=videos.find(v=>v.srcObject&&v.srcObject.getVideoTracks().length)||videos.find(v=>v.autoplay);
  if(video){video.style.setProperty('z-index','0','important');video.style.setProperty('visibility','visible','important');video.style.setProperty('opacity','1','important');}
  scene.style.setProperty('z-index','1','important');
  scene.style.setProperty('background','transparent','important');
  if(scene.renderer){scene.renderer.setClearColor(0x000000,0);scene.renderer.setClearAlpha(0);scene.renderer.autoClear=true;}
  if(scene.object3D)scene.object3D.background=null;
  return !!video;
}

// Keep camera cover and renderer dimensions synchronized after mobile viewport changes.
function resizeAR(){
 const system=scene.systems['mindar-image-system'];
 if(system && system.controller && system.video && system.video.videoWidth){
   system._resize();
   const stage=$('#ar-stage');
   if(scene.renderer)scene.renderer.setSize(stage.clientWidth,stage.clientHeight);
 }
 repairCameraLayer();
}
window.addEventListener('resize',resizeAR);
if(window.visualViewport)window.visualViewport.addEventListener('resize',resizeAR);
scene.addEventListener('arReady',resizeAR);
function schedule(fn,delay){timers.push(setTimeout(fn,delay))}
function cancelTimers(){while(timers.length)clearTimeout(timers.pop())}
function notice(s){const n=$('#note');n.textContent=s;n.style.display='block';setTimeout(()=>n.style.display='none',2600)}
const leftModel=$('#left-model');
let leftModelReady=false;
$('#begin').disabled=true;
$('#begin').textContent='Cargando modelo 3D…';

function prepareLeftModel(){
 if(leftModelReady)return;
 const model=leftModel.getObject3D('mesh');
 if(!model)return;
 leftModelReady=true;
 status.textContent='Todo listo para comenzar';
 $('#begin').disabled=false;
 $('#begin').textContent='Comenzar experiencia';
}
function modelFailure(){
 leftModelReady=false;
 status.textContent='No se pudo cargar la rama 3D';
 $('#begin').disabled=true;
 $('#begin').textContent='Recarga para volver a intentar';
}
leftModel.addEventListener('model-loaded',prepareLeftModel);
leftModel.addEventListener('model-error',modelFailure);
prepareLeftModel();
const branches=[];
// Both sides now use the supplied GLB; no procedural branch is added.
function enter(mesh,delay){schedule(()=>{
 const started=performance.now(),duration=1400,animationRun=run;
 function tick(now){
  if(animationRun!==run)return;
  const t=Math.min(1,(now-started)/duration),e=1-Math.pow(1-t,3);
  mesh.scale.setScalar(Math.max(.001,e*.78));
  if(t<1)requestAnimationFrame(tick);
 }
 requestAnimationFrame(tick);
},delay)}
const narration=new Audio('./ecoandino-voz.mp3');
narration.preload='auto';
narration.playsInline=true;
let audioUnlocked=false;
narration.addEventListener('error',()=>{console.warn('Falta ecoandino-voz.mp3 o no pudo reproducirse');});
async function unlockNarration(){
 try{
  // Playback must be initiated from the user's tap on iOS.
  narration.muted=true;
  await narration.play();
  narration.pause();narration.currentTime=0;narration.muted=false;
  audioUnlocked=true;
 }catch(err){console.warn('Audio unlock requires a fresh tap',err)}
}
function narrate(){
 if(!sound)return;
 narration.pause();narration.currentTime=0;
 narration.play().catch(err=>console.warn('Narration playback blocked or file unavailable',err));
}
function reset(){cancelTimers();run++;actions.classList.remove('show');$('#line').style.opacity=0;vegetation.setAttribute('visible',false);pod.setAttribute('visible',false);branches.forEach(b=>b.scale.setScalar(.001));pod.removeAttribute('animation__spin');pod.removeAttribute('animation__grow');pod.removeAttribute('animation__rise');pod.setAttribute('animation__grow','property:scale;from:.001 .001 .001;to:.01 .01 .01;dur:1300;easing:easeOutCubic;startEvents:grow;autoplay:false');pod.setAttribute('animation__rise','property:position;from:0 0 .03;to:0 0 .16;dur:1300;easing:easeOutCubic;startEvents:grow;autoplay:false');pod.setAttribute('rotation','0 0 0');pod.setAttribute('position','0 0 .03');pod.setAttribute('scale','.001 .001 .001');narration.pause();narration.currentTime=0}
function play(){reset();played=true;visible=true;const id=run;status.textContent='Ecoandino · experiencia activa';vegetation.setAttribute('visible',true);if(branches[0])enter(branches[0],150);if(branches[1])enter(branches[1],380);schedule(()=>{if(id!==run)return;if(!soloRama){pod.setAttribute('visible',true);pod.emit('grow');}$('#line').textContent='Desde la selva central del Perú nace nuestro cacao. Descubre su origen.';$('#line').style.opacity=1;narrate()},2500);schedule(()=>{if(!visible||id!==run)return;pod.setAttribute('animation__spin','property: rotation; from: 0 0 0; to: 0 360 0; dur: 3500; easing: easeInOutSine; autoplay: false; startEvents: spin');pod.emit('spin')},4100);schedule(()=>{if(!visible||id!==run)return;actions.classList.add('show');status.textContent='Explora el empaque y selecciona una opción'},7200)}
let activeTarget=null;
function onFound(targetEl,label){
 if(activeTarget!==targetEl){reset();activeTarget=targetEl;pod=targetEl.querySelector('[id^="pod"]');played=false;}
 visible=true;
 if(!played)play();
 status.textContent='Detectado: '+label;
}
function onLost(targetEl){
 if(activeTarget!==targetEl)return;
 visible=false;lostAt=Date.now();status.textContent='Vuelve a enfocar el empaque';
}
marker.addEventListener('targetFound',()=>onFound(marker,dualTargetsReady?'Nibs con yacón':'experiencia activa'));
marker.addEventListener('targetLost',()=>onLost(marker));
marker2.addEventListener('targetFound',()=>onFound(marker2,'Cacao criollo en polvo'));
marker2.addEventListener('targetLost',()=>onLost(marker2));
$('#begin').addEventListener('click',async()=>{if(started)return;started=true;$('#begin').disabled=true;try{const unlockPromise=unlockNarration();if(!scene.hasLoaded)await new Promise(r=>scene.addEventListener('loaded',r,{once:true}));if(!leftModelReady)await new Promise((resolve,reject)=>{
 const timeout=setTimeout(()=>done(new Error('No se pudo cargar la rama 3D. Recarga esta prueba.')),30000);
 function done(error){clearTimeout(timeout);leftModel.removeEventListener('model-loaded',ready);leftModel.removeEventListener('model-error',failed);error?reject(error):resolve();}
 function ready(){prepareLeftModel();done(leftModelReady?null:new Error('Modelo 3D inválido'));}
 function failed(){done(new Error('No se pudo descargar la rama 3D'));}
 leftModel.addEventListener('model-loaded',ready,{once:true});leftModel.addEventListener('model-error',failed,{once:true});
 prepareLeftModel();if(leftModelReady)done();
});await new Promise((resolve,reject)=>{
 const timeout=setTimeout(()=>finish(new Error('La cámara tardó demasiado en iniciar')),45000);
 function finish(error){clearTimeout(timeout);scene.removeEventListener('arReady',ready);scene.removeEventListener('arError',failed);error?reject(error):resolve();}
 function ready(){finish();}
 function failed(){finish(new Error('No se pudo iniciar el escaneo; revisa el permiso de cámara'));}
 scene.addEventListener('arReady',ready,{once:true});
 scene.addEventListener('arError',failed,{once:true});
 try{scene.systems['mindar-image-system'].start();}catch(error){finish(error);}
});await unlockPromise;repairCameraLayer();setTimeout(repairCameraLayer,500);$('#start').style.display='none';$('#mute').style.display='block';status.textContent='Enfoca cualquiera de los dos empaques Ecoandino'}catch(e){started=false;$('#begin').disabled=false;status.textContent=e.message;notice(e.message);console.error(e)}});
$('#mute').addEventListener('click',()=>{sound=!sound;$('#mute').textContent=sound?'🔊':'🔇';if(!sound){narration.pause();narration.currentTime=0}else if(!audioUnlocked){unlockNarration()}});
actions.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.dataset.action==='website')window.open('https://ecoandino.com/','_blank','noopener,noreferrer');else if(activeTarget&&visible){for(const el of activeTarget.querySelectorAll('[branch-reveal]')){const c=el.components['branch-reveal'];if(c){c.elapsed=0;c.level.value=-.98;el.object3D.visible=false;}}play();}else notice('Enfoca el empaque para repetir la experiencia')});
window.addEventListener('pagehide',()=>{cancelTimers();if('speechSynthesis' in window)speechSynthesis.cancel()});
})();
</script>
</body></html>
