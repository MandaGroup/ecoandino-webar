<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ecoandino | Experiencia WebAR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:transparent;color:white}a-scene{position:fixed;inset:0;z-index:1;width:100%!important;height:100%!important;background:transparent!important}.a-canvas{width:100%!important;height:100%!important;background:transparent!important}video[src]{max-width:none}body>video,body>.mindar-ui-overlay~video{z-index:0!important}#ui{position:fixed;z-index:10;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:space-between;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom))}#status{background:#102819dc;padding:10px 16px;border:1px solid #ffffff44;border-radius:30px;font-size:13px;text-align:center}#lower{width:min(440px,100%)}#line{text-align:center;font-weight:bold;text-shadow:0 2px 8px #000;margin-bottom:16px;opacity:0;transition:opacity .5s}#actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;opacity:0;transform:translateY(22px);transition:opacity .4s,transform .4s;pointer-events:none}#actions.show{opacity:1;transform:none;pointer-events:auto}#actions button{color:white;background:#123b25e8;border:1px solid #ffffff66;border-radius:12px;padding:13px 7px;font-size:13px;font-weight:bold}#start{position:fixed;inset:0;z-index:20;background:#102819ee;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px}#start>div{max-width:340px}#start h1{font-size:25px}#start p{line-height:1.45;color:#dce8df}#begin{border:0;background:#91c53f;border-radius:12px;padding:15px 24px;font-size:16px;font-weight:bold;color:#18301b}#mute{display:none;position:fixed;z-index:11;right:15px;top:calc(env(safe-area-inset-top) + 72px);pointer-events:auto;border-radius:50%;padding:11px;background:#183a26;color:white;border:1px solid #ffffff55}#note{position:fixed;z-index:12;left:25px;right:25px;bottom:35%;text-align:center;background:#102819ed;border-radius:12px;padding:14px;display:none;font-size:13px}
</style>
</head>
<body>
<a-scene id="scene" mindar-image="imageTargetSrc: ./ecoandino.mind; autoStart: false;" renderer="colorManagement: true; antialias: true; alpha: true" background="color: #000000; transparent: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
<a-assets><a-asset-item id="cacao" src="./cacao.glb"></a-asset-item></a-assets>
<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
<a-entity id="marker" mindar-image-target="targetIndex:0">
<a-entity id="vegetation" visible="false"></a-entity>
<a-gltf-model id="pod" src="#cacao" visible="false" position="0 0 .03" rotation="0 0 0" scale=".001 .001 .001"
animation__grow="property:scale;from:.001 .001 .001;to:.01 .01 .01;dur:1300;easing:easeOutCubic;startEvents:grow;autoplay:false"
animation__rise="property:position;from:0 0 .03;to:0 0 .16;dur:1300;easing:easeOutCubic;startEvents:grow;autoplay:false"
animation__spin="property:rotation;from:0 0 0;to:0 360 0;dur:3500;easing:easeInOutSine;startEvents:spin;autoplay:false"></a-gltf-model>
</a-entity></a-scene>
<div id="ui"><div id="status" role="status">Activa la experiencia</div><div id="lower"><div id="line">Desde la selva peruana, a tus manos.</div><div id="actions"><button data-action="Puntos de venta">📍 Puntos de venta</button><button data-action="Compras por mayor">📦 Compras por mayor</button><button data-action="Recetas">🍫 Recetas</button><button data-action="Sitio web">🌿 Sitio web</button></div></div></div>
<button id="mute" aria-label="Activar o silenciar narración">🔊</button><div id="note" role="status"></div>
<div id="start"><div><h1>Ecoandino cobra vida</h1><p>Apunta la cámara al empaque para descubrir nuestro cacao en realidad aumentada.</p><button id="begin">Comenzar experiencia</button><p style="font-size:12px">Prototipo: reconoce el marcador existente. Se añadirán los dos empaques con sticker cuando estén fotografiados.</p></div></div>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s),scene=$('#scene'),marker=$('#marker'),pod=$('#pod'),vegetation=$('#vegetation'),status=$('#status'),actions=$('#actions');
let visible=false,started=false,sound=true,played=false,lostAt=0,run=0;
const timers=[];
function repairCameraLayer(){
  // MindAR creates its own camera video; place it ABOVE the page background and BELOW WebGL.
  const videos=Array.from(document.querySelectorAll('video'));
  const video=videos.find(v=>v.srcObject&&v.srcObject.getVideoTracks().length)||videos.find(v=>v.autoplay);
  if(video){video.style.setProperty('z-index','0','important');video.style.setProperty('visibility','visible','important');video.style.setProperty('opacity','1','important');}
  scene.style.setProperty('z-index','1','important');
  scene.style.setProperty('background','transparent','important');
  if(scene.renderer){scene.renderer.setClearColor(0x000000,0);scene.renderer.setClearAlpha(0);scene.renderer.autoClear=true;}
  if(scene.object3D)scene.object3D.background=null;
  return !!video;
}

function schedule(fn,delay){timers.push(setTimeout(fn,delay))}
function cancelTimers(){while(timers.length)clearTimeout(timers.pop())}
function notice(s){const n=$('#note');n.textContent=s;n.style.display='block';setTimeout(()=>n.style.display='none',2600)}
// Transparent botanical illustrations are generated locally; each plane is anchored to the MindAR target.
// Replace canvases with approved PNG assets after visual review, without changing the tracking logic.
function botanicalCanvas(side){
const c=document.createElement('canvas');c.width=512;c.height=768;const x=c.getContext('2d');const flip=side==='right';x.save();if(flip){x.translate(512,0);x.scale(-1,1)}
function stem(points,width){x.strokeStyle='#6c4b2b';x.lineWidth=width;x.lineCap='round';x.lineJoin='round';x.beginPath();points.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.stroke()}
stem([[400,750],[365,580],[295,420],[170,240],[95,80]],18);
stem([[310,455],[185,360],[85,365]],11);stem([[238,335],[300,210],[350,155]],10);
function leaf(cx,cy,ang,size,color){x.save();x.translate(cx,cy);x.rotate(ang);x.fillStyle=color;x.beginPath();x.moveTo(0,0);x.bezierCurveTo(-size*.7,-size*.45,-size*.8,-size*.98,0,-size*1.6);x.bezierCurveTo(size*.8,-size*.98,size*.7,-size*.45,0,0);x.fill();x.strokeStyle='#a8bc72';x.lineWidth=2;x.beginPath();x.moveTo(0,0);x.lineTo(0,-size*1.35);x.stroke();x.restore()}
[[350,575,.9,83],[294,423,-.8,90],[210,300,.65,83],[135,195,-.8,79],[100,362,-.85,72],[312,212,.7,65]].forEach((a,i)=>leaf(...a,i%2?'#3c8a31':'#5ba744'));
function fruit(cx,cy,a){x.save();x.translate(cx,cy);x.rotate(a);const g=x.createLinearGradient(-38,0,42,0);g.addColorStop(0,'#904118');g.addColorStop(.5,'#eaa03b');g.addColorStop(1,'#9f501b');x.fillStyle=g;x.beginPath();x.moveTo(0,-76);x.bezierCurveTo(-62,-58,-64,50,0,91);x.bezierCurveTo(64,50,62,-58,0,-76);x.fill();x.strokeStyle='#b75e25';x.lineWidth=3;for(const dx of [-26,-12,12,26]){x.beginPath();x.moveTo(dx/8,-68);x.quadraticCurveTo(dx*2,0,dx/9,76);x.stroke()}x.restore()}
fruit(310,510,.36);fruit(198,280,-.22);x.restore();return c;
}
function makePlane(side){const tex=new THREE.CanvasTexture(botanicalCanvas(side));tex.colorSpace=THREE.SRGBColorSpace;const mesh=new THREE.Mesh(new THREE.PlaneGeometry(.46,.85),new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide,depthWrite:false}));mesh.position.set(side==='left'?-0.86:0.86,.08,.025);mesh.rotation.y=side==='left'?.25:-.25;mesh.scale.setScalar(.001);vegetation.object3D.add(mesh);return mesh}
const branches=[makePlane('left'),makePlane('right')];
function enter(mesh,delay){schedule(()=>{const start=performance.now(),duration=1250;function tick(now){if(!visible||!vegetation.getAttribute('visible'))return;const t=Math.min(1,(now-start)/duration);const eased=1-Math.pow(1-t,3);mesh.scale.setScalar(Math.max(.001,eased));if(t<1)requestAnimationFrame(tick)}requestAnimationFrame(tick)},delay)}
function narrate(){if(!sound||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const v=new SpeechSynthesisUtterance('Desde la selva peruana nace nuestro cacao. Naturaleza y tradición, en tus manos.');v.lang='es-PE';v.rate=1.03;const voices=speechSynthesis.getVoices();v.voice=voices.find(z=>z.lang==='es-PE')||voices.find(z=>z.lang.startsWith('es'))||null;speechSynthesis.speak(v)}catch(e){console.warn(e)}}
function reset(){cancelTimers();run++;actions.classList.remove('show');$('#line').style.opacity=0;vegetation.setAttribute('visible',false);pod.setAttribute('visible',false);branches.forEach(b=>b.scale.setScalar(.001));pod.removeAttribute('animation__spin');pod.setAttribute('rotation','0 0 0');pod.setAttribute('position','0 0 .03');pod.setAttribute('scale','.001 .001 .001');if('speechSynthesis' in window)speechSynthesis.cancel()}
function play(){reset();played=true;visible=true;const id=run;status.textContent='Ecoandino · experiencia activa';vegetation.setAttribute('visible',true);enter(branches[0],150);enter(branches[1],380);schedule(()=>{if(!visible||id!==run)return;pod.setAttribute('visible',true);pod.emit('grow');$('#line').style.opacity=1;narrate()},2500);schedule(()=>{if(!visible||id!==run)return;pod.setAttribute('animation__spin','property: rotation; from: 0 0 0; to: 0 360 0; dur: 3500; easing: easeInOutSine; autoplay: false; startEvents: spin');pod.emit('spin')},4100);schedule(()=>{if(!visible||id!==run)return;actions.classList.add('show');status.textContent='Explora el empaque y selecciona una opción'},7200)}
marker.addEventListener('targetFound',()=>{visible=true;if(!played||Date.now()-lostAt>2500)play();else status.textContent='Ecoandino · experiencia activa'});
marker.addEventListener('targetLost',()=>{visible=false;lostAt=Date.now();status.textContent='Vuelve a enfocar el empaque'});
$('#begin').addEventListener('click',async()=>{if(started)return;started=true;$('#begin').disabled=true;try{if(!scene.hasLoaded)await new Promise(r=>scene.addEventListener('loaded',r,{once:true}));await scene.systems['mindar-image-system'].start();repairCameraLayer();setTimeout(repairCameraLayer,500);$('#start').style.display='none';$('#mute').style.display='block';status.textContent='Enfoca el marcador de prueba; el empaque final requiere su propio reconocimiento'}catch(e){started=false;$('#begin').disabled=false;status.textContent='No se pudo activar la cámara';notice('Revisa los permisos de cámara y abre mediante HTTPS');console.error(e)}});
$('#mute').addEventListener('click',()=>{sound=!sound;$('#mute').textContent=sound?'🔊':'🔇';if(!sound&&'speechSynthesis' in window)speechSynthesis.cancel()});
actions.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;notice(btn.dataset.action+': enlace pendiente de configurar con Ecoandino')});
window.addEventListener('pagehide',()=>{cancelTimers();if('speechSynthesis' in window)speechSynthesis.cancel()});
})();
</script>
</body></html>
